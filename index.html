<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendar Cuti Kohort (2025)</title>
<meta name="description" content="Kalendar cuti sekolah — semak tarikh, hari dan status setiap hari cuti.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="strip-holes" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Semester 3 Kohort (2025) &middot; Malaysia</p>
    <h1 class="hero-title">Kalendar<br>Cuti Sekolah</h1>
    <p class="hero-sub">28 Ogos &ndash; 5 Oktober 2026</p>

    <div class="countdown-card" id="countdownCard">
      <span class="countdown-label" id="countdownLabel">Mengira&hellip;</span>
      <div class="countdown-clock" id="countdownClock">
        <div class="clock-seg"><span class="clock-num" id="clockDays">00</span><span class="clock-unit">hari</span></div>
        <span class="clock-colon">:</span>
        <div class="clock-seg"><span class="clock-num" id="clockHours">00</span><span class="clock-unit">jam</span></div>
        <span class="clock-colon">:</span>
        <div class="clock-seg"><span class="clock-num" id="clockMins">00</span><span class="clock-unit">minit</span></div>
        <span class="clock-colon">:</span>
        <div class="clock-seg"><span class="clock-num" id="clockSecs">00</span><span class="clock-unit">saat</span></div>
      </div>
      <span class="countdown-suffix" id="countdownSuffix"></span>
    </div>
  </div>
</header>

<main class="calendar" id="calendar">
  <!-- weeks are injected by script.js -->
</main>

<footer class="site-footer">
  <p>Dijana untuk makluman peribadi &middot; Sila semak semula dengan takwim rasmi Kementerian Pendidikan Malaysia / Jabatan Pendidikan Negeri.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
